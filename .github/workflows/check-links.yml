name: Comprobar ligazóns

on:
  push:
    branches:
      - master
    paths:
      - index.html
      - README.md
      - sitemap.xml
      - .github/workflows/check-links.yml
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar o repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Comprobar as ligazóns da web
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --no-progress
            --verbose
            --accept 200,206,403,429
            --exclude '^https://www\.linkedin\.com/'
            './index.html'
            './README.md'
            './sitemap.xml'
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          token: "${{ secrets.GITHUB_TOKEN }}"
