name: Actualizar a data xeral da páxina

on:
  push:
    branches:
      - master
    paths:
      - index.html
      - styles.css
      - script.js
      - print.css
      - scripts/update_page_date.py
      - .github/workflows/update-page-date.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-page-date
  cancel-in-progress: false

jobs:
  update-page-date:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar o historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular a data xeral
        run: python scripts/update_page_date.py --write

      - name: Publicar a data se cambiou
        run: |
          if git diff --quiet -- index.html; then
            echo "A data xa está actualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualiza a data xeral da páxina [skip page-date]"
          git push
