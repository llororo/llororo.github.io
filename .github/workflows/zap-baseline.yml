name: Comprobar a web publicada con OWASP ZAP

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: Revisión pasiva da web
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar a configuración da revisión
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analizar a web publicada
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://llororo.github.io/"
          cmd_options: "-c .zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false
          artifact_name: informe-zap
